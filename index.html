<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rasm → 3D GLB</title>
  <link rel="stylesheet" href="index.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <main class="card">
    <h1>Rasm → 3D (.glb)</h1>
    <p class="sub">Brauzerning o'zida ishlaydi, internet limiti yo'q.</p>

    <label class="drop" for="file">
      <span id="dropText">📷 Rasm tanlash</span>
    </label>
    <input type="file" id="file" accept="image/*" hidden>

    <div id="viewer" hidden></div>

    <div id="controls" hidden>
      <label class="field">Balandlik (relyef): <b id="depthVal">0.30</b>
        <input type="range" id="depth" min="0.02" max="1" step="0.02" value="0.3">
      </label>
      <label class="field">Silliqlash: <b id="smoothVal">2</b>
        <input type="range" id="smooth" min="0" max="8" step="1" value="2">
      </label>
      <label class="field">Detal (to'r): <b id="resVal">160</b>
        <input type="range" id="res" min="64" max="256" step="32" value="160">
      </label>
      <label class="check"><input type="checkbox" id="invert"> Teskari (qora = baland)</label>
    </div>

    <button id="createBtn" disabled>✨ Yaratish</button>
    <p id="status" class="status"></p>
    <a id="downloadBtn" class="download" hidden>⬇️ GLB yuklab olish</a>
  </main>

  <script type="module" src="index.js"></script>
</body>
</html>
