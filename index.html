<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rasm → 3D GLB</title>
  <link rel="stylesheet" href="index.css">
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
</head>
<body>
  <main class="card">
    <h1>Rasm → 3D (.glb)</h1>
    <p class="sub">Rasm yuklang, "Yaratish" tugmasini bosing.</p>

    <label class="drop" for="file">
      <img id="preview" alt="" hidden>
      <span id="dropText">📷 Rasm tanlash</span>
    </label>
    <input type="file" id="file" accept="image/*" hidden>

    <label class="check">
      <input type="checkbox" id="removeBg" checked>
      Orqa fonni olib tashlash
    </label>

    <button id="createBtn" disabled>✨ Yaratish</button>
    <p id="status" class="status"></p>

    <model-viewer id="viewer" camera-controls auto-rotate shadow-intensity="1" hidden></model-viewer>

    <a id="downloadBtn" class="download" hidden>⬇️ GLB yuklab olish</a>

    <details>
      <summary>Sozlamalar</summary>
      <label class="field">Hugging Face Space nomi
        <input type="text" id="spaceId" value="stabilityai/TripoSR">
      </label>
      <label class="field">Sifat (mc_resolution): <b id="resVal">256</b>
        <input type="range" id="resolution" min="128" max="320" step="32" value="256">
      </label>
      <label class="field">HF token (ixtiyoriy, limitni oshiradi)
        <input type="password" id="hfToken" placeholder="hf_...">
      </label>
    </details>
  </main>

  <script type="module" src="index.js"></script>
</body>
</html>
