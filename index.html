<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 3D Generator — Rasm → GLB</title>
    <link rel="stylesheet" href="index.css">
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            "@gradio/client": "https://cdn.jsdelivr.net/npm/@gradio/client@2.7.1/dist/index.min.js"
        }
    }
    </script>
</head>
<body>
    <div class="app">
        <header>
            <h1>🧊 AI 3D Generator</h1>
            <p class="subtitle">Rasm yuklang — bir necha soniyada 3D GLB model oling</p>
        </header>

        <main class="main-panel">
            <section class="upload-panel">
                <div id="dropZone" class="drop-zone">
                    <input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp" hidden>
                    <div class="drop-content">
                        <span class="drop-icon">📷</span>
                        <p><strong>Rasmni bu yerga tashlang</strong></p>
                        <p class="hint">yoki <button type="button" id="browseBtn" class="link-btn">fayl tanlang</button></p>
                        <p class="formats">PNG, JPG, WebP — maks. 8 MB</p>
                    </div>
                </div>

                <div id="previewContainer" class="preview-container hidden">
                    <img id="previewImage" alt="Yuklangan rasm">
                    <button id="clearBtn" class="clear-btn" title="O'chirish">✕</button>
                </div>

                <button id="generateBtn" class="generate-btn" disabled>
                    <span class="btn-text">🎨 3D Model Yaratish</span>
                    <span class="spinner hidden"></span>
                </button>

                <div id="status" class="status hidden"></div>
            </section>

            <section class="viewer-panel">
                <div id="viewer" class="viewer">
                    <div class="viewer-placeholder">
                        <span>🖼️</span>
                        <p>3D model shu yerda paydo bo'ladi</p>
                    </div>
                </div>
                <div class="viewer-actions">
                    <button id="downloadBtn" class="action-btn" disabled>⬇️ GLB yuklab olish</button>
                    <button id="resetCameraBtn" class="action-btn" disabled>🔄 Kamerani tiklash</button>
                </div>
            </section>
        </main>

      <footer>
    <p>Powered by <a href="https://huggingface.co/spaces/stabilityai/stable-point-aware-3d" target="_blank" rel="noopener">Stable Point-Aware 3D</a> — Bepul, API kalitsiz</p>
</footer>
    </div>

    <script type="module" src="index.js"></script>
</body>
</html>
